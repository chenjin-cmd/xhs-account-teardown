    <rect width="88" height="20" fill="url(#s)"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-family="Verdana, DejaVu Sans, PingFang SC, Microsoft YaHei, sans-serif" font-size="11">
    <text x="28" y="14" textLength="44" lengthAdjust="spacing">license</text>
    <text x="72" y="14" textLength="20" lengthAdjust="spacing">MIT</text>
  </g>
