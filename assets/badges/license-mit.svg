<svg xmlns="http://www.w3.org/2000/svg" width="88" height="20" role="img" aria-label="license: MIT">
  <title>license: MIT</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r"><rect width="88" height="20" rx="3" fill="#ffffff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="56" height="20" fill="#555555"/>
