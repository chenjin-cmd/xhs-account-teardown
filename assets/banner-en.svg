  </g>

  <text x="64" y="160" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="700" fill="#1a1a1a">
    <tspan>Xiaohongshu </tspan><tspan fill="#FF2442">Teardown</tspan>
  </text>

  <text x="66" y="212" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#555555">Input a profile link, get a six-question teardown report.</text>

  <text x="66" y="272" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#999999">Anonymous scraping · Zero deps · Agent-agnostic · macOS / Linux</text>

  <g transform="translate(852,72)">
    <rect x="0" y="0" width="270" height="216" rx="20" fill="#ffffff" stroke="#ffe1e6" stroke-width="2"/>
    <rect x="20" y="20" width="230" height="118" rx="14" fill="url(#accent)"/>
    <text x="135" y="92" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">6 Q</text>
    <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#333333">
      <circle cx="36" cy="164" r="4" fill="#FF2442"/>
      <text x="48" y="169">who pays</text>
      <circle cx="140" cy="164" r="4" fill="#ff9aab"/>
