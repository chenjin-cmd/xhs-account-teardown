    <circle cx="240" cy="40" r="16" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <line x1="252" y1="52" x2="262" y2="62" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
